version: '3.8'

services:
  # ==========================================
  # 1. PostgreSQL Database Service
  # ==========================================
  postgres-db:
    image: postgres:15-alpine
    container_name: devops-postgres-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-microservices_db}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-microservices_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ==========================================
  # 2. Redis Cache Service
  # ==========================================
  redis-cache:
    image: redis:7-alpine
    container_name: devops-redis-cache
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ==========================================
  # 3. Python FastAPI Application Service
  # ==========================================
  fastapi-app:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: devops-fastapi-app
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_password}
      POSTGRES_DB: ${POSTGRES_DB:-microservices_db}
      POSTGRES_HOST: postgres-db
      POSTGRES_PORT: 5432
      REDIS_HOST: redis-cache
      REDIS_PORT: 6379
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ==========================================
  # 4. Nginx Reverse Proxy Service
  # ==========================================
  nginx-proxy:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: devops-nginx-proxy
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      fastapi-app:
        condition: service_healthy
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/nginx-health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

# Custom Bridge Network
networks:
  microservices-net:
    driver: bridge
    name: microservices-net

# Persistent Volumes
volumes:
  db_data:
    name: microservices_db_data
  redis_data:
    name: microservices_redis_data
