name: Docker Compose & Trivy Security Scan

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  trivy-scan:
    name: Security Vulnerability & IaC Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Image
        uses: docker/build-push-action@v5
        with:
          context: ./Semua/project-02-microservices-docker-security/app
          file: ./Semua/project-02-microservices-docker-security/app/Dockerfile
          load: true
          tags: fastapi-app:local

      - name: Build Nginx Image
        uses: docker/build-push-action@v5
        with:
          context: ./Semua/project-02-microservices-docker-security/nginx
          file: ./Semua/project-02-microservices-docker-security/nginx/Dockerfile
          load: true
          tags: nginx-proxy:local

      - name: Run Trivy Vulnerability Scanner on FastAPI Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fastapi-app:local'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy Vulnerability Scanner on Nginx Image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'nginx-proxy:local'
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'

      - name: Run Trivy IaC Scanner on Repository
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          hide-progress: false
          format: 'table'
          exit-code: '0'
